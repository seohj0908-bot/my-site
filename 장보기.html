<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5ecd9;
    --paper: #fffaf0;
    --ink: #4a3426;
    --muted: #9a8270;
    --accent: #e07b39;
    --accent-dark: #b85c22;
    --line: #e8d9bf;
    --tape: rgba(224, 123, 57, 0.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image:
      radial-gradient(rgba(120, 90, 60, 0.06) 1px, transparent 1px),
      radial-gradient(rgba(120, 90, 60, 0.04) 1px, transparent 1px);
    background-size: 18px 18px, 31px 31px;
    background-position: 0 0, 9px 13px;
    color: var(--ink);
    font-family: "Gaegu", "Comic Sans MS", "Malgun Gothic", sans-serif;
    font-size: 21px;
    line-height: 1.4;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 {
    text-align: center;
    font-size: 2.4em;
    margin: 0 0 6px;
    color: var(--accent-dark);
  }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }

  /* 추가 칸 */
  .add {
    display: flex; flex-wrap: wrap; gap: 10px;
    background: var(--paper);
    padding: 14px;
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(74, 52, 38, 0.12);
    margin-bottom: 34px;
  }
  .add input, .add select, .add button {
    font: inherit; color: inherit;
    border: 2px dashed var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    background: #fff;
  }
  .add input { flex: 1 1 200px; min-width: 0; }
  .add select { flex: 0 1 auto; }
  .add input:focus, .add select:focus { outline: none; border-color: var(--accent); }
  .add button {
    background: var(--accent); color: #fff; border: 2px solid var(--accent);
    font-weight: 700; cursor: pointer; padding: 6px 20px;
  }
  .add button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

  /* 메모지 카드 */
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 30px 24px;
  }
  .note {
    position: relative;
    background: var(--paper);
    padding: 26px 18px 16px;
    border-radius: 3px;
    box-shadow: 2px 5px 12px rgba(74, 52, 38, 0.16);
    transform: rotate(var(--tilt, 0deg));
    transition: transform .2s;
  }
  .note:hover { transform: rotate(0deg); }
  .note::before {
    content: "";
    position: absolute; top: -12px; left: 50%;
    width: 90px; height: 24px;
    transform: translateX(-50%) rotate(-3deg);
    background: var(--tape);
  }
  .note h2 {
    margin: 0 0 8px;
    font-size: 1.35em;
    border-bottom: 2px solid var(--line);
    padding-bottom: 4px;
  }
  .note h2 .count { color: var(--muted); font-size: .7em; font-weight: 400; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 8px;
    padding: 3px 0;
    border-bottom: 1px dashed var(--line);
  }
  li:last-child { border-bottom: 0; }
  li label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; min-width: 0; }
  li label span { overflow-wrap: anywhere; }
  li input[type=checkbox] {
    width: 20px; height: 20px; flex: none;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .del {
    flex: none;
    border: 0; background: none;
    color: var(--muted);
    font: inherit; font-size: .9em;
    cursor: pointer;
    padding: 0 4px;
    opacity: .5;
  }
  li:hover .del, .del:focus { opacity: 1; }
  .del:hover { color: var(--accent-dark); }
  .empty { color: var(--muted); font-size: .9em; padding: 4px 0; }

  /* 장바구니 */
  .basket {
    margin-top: 44px;
    --tilt: -0.6deg;
    background: #fdf1e2;
  }
  .basket li label span { text-decoration: line-through; color: var(--muted); }
  .basket .tag { color: var(--muted); font-size: .8em; flex: none; }

  @media (max-width: 520px) {
    body { font-size: 19px; }
    h1 { font-size: 2em; }
    .add button { flex: 1 1 100%; }
    .add select { flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>우리 집 장보기 📝</h1>
  <p class="sub">살 것을 누르면 장바구니로 쏙!</p>

  <form class="add" id="addForm" autocomplete="off">
    <input id="newName" type="text" placeholder="무엇을 살까요? (예: 두부)" maxlength="40" required>
    <select id="newCat" aria-label="종류"></select>
    <button type="submit">추가</button>
  </form>

  <div class="board" id="board"></div>

  <section class="note basket">
    <h2>🧺 장바구니에 담은 것 <span class="count" id="basketCount"></span></h2>
    <ul id="basketList"></ul>
  </section>
</div>

<script>
  var STORAGE_KEY = "our-home-groceries-v1";

  var CATEGORIES = [
    { id: "veg",   name: "🥬 채소·과일",    tilt: "-1.5deg" },
    { id: "meat",  name: "🥩 고기·생선",    tilt: "1.2deg" },
    { id: "dairy", name: "🥛 유제품·달걀",  tilt: "-0.8deg" },
    { id: "home",  name: "🧻 생활용품",     tilt: "1.6deg" }
  ];

  var DEFAULT_ITEMS = [
    ["veg", "대파"], ["veg", "양파"], ["veg", "감자"], ["veg", "사과"], ["veg", "바나나"],
    ["meat", "돼지고기"], ["meat", "닭가슴살"], ["meat", "고등어"],
    ["dairy", "우유"], ["dairy", "달걀"], ["dairy", "치즈"], ["dairy", "요거트"],
    ["home", "휴지"], ["home", "세제"], ["home", "주방세제"], ["home", "쓰레기봉투"]
  ];

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (Array.isArray(data)) return data;
      }
    } catch (e) {}
    return DEFAULT_ITEMS.map(function (pair) {
      return { id: makeId(), cat: pair[0], name: pair[1], done: false };
    });
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }

  var items = load();

  var board = document.getElementById("board");
  var basketList = document.getElementById("basketList");
  var basketCount = document.getElementById("basketCount");
  var catSelect = document.getElementById("newCat");

  CATEGORIES.forEach(function (c) {
    var opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name;
    catSelect.appendChild(opt);
  });

  function catName(id) {
    for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i].name;
    return "";
  }

  function itemRow(item, showTag) {
    var li = document.createElement("li");
    var label = document.createElement("label");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = item.done;
    box.addEventListener("change", function () {
      item.done = box.checked;
      save();
      render();
    });
    var text = document.createElement("span");
    text.textContent = item.name;
    label.appendChild(box);
    label.appendChild(text);
    li.appendChild(label);

    if (showTag) {
      var tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = catName(item.cat).split(" ")[0];
      li.appendChild(tag);
    }

    var del = document.createElement("button");
    del.className = "del";
    del.type = "button";
    del.textContent = "✕";
    del.title = item.name + " 지우기";
    del.setAttribute("aria-label", item.name + " 지우기");
    del.addEventListener("click", function () {
      items = items.filter(function (x) { return x.id !== item.id; });
      save();
      render();
    });
    li.appendChild(del);
    return li;
  }

  function emptyRow(text) {
    var li = document.createElement("li");
    li.className = "empty";
    li.textContent = text;
    return li;
  }

  function render() {
    board.innerHTML = "";
    CATEGORIES.forEach(function (c) {
      var todo = items.filter(function (x) { return x.cat === c.id && !x.done; });
      var note = document.createElement("section");
      note.className = "note";
      note.style.setProperty("--tilt", c.tilt);
      var h = document.createElement("h2");
      h.textContent = c.name + " ";
      var cnt = document.createElement("span");
      cnt.className = "count";
      cnt.textContent = todo.length ? "(" + todo.length + ")" : "";
      h.appendChild(cnt);
      note.appendChild(h);
      var ul = document.createElement("ul");
      if (todo.length) todo.forEach(function (x) { ul.appendChild(itemRow(x, false)); });
      else ul.appendChild(emptyRow("다 담았어요 ✔"));
      note.appendChild(ul);
      board.appendChild(note);
    });

    basketList.innerHTML = "";
    var done = items.filter(function (x) { return x.done; });
    basketCount.textContent = done.length ? "(" + done.length + ")" : "";
    if (done.length) done.forEach(function (x) { basketList.appendChild(itemRow(x, true)); });
    else basketList.appendChild(emptyRow("아직 담은 게 없어요"));
  }

  document.getElementById("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("newName");
    var name = input.value.trim();
    if (!name) return;
    items.push({ id: makeId(), cat: catSelect.value, name: name, done: false });
    save();
    render();
    input.value = "";
    input.focus();
  });

  render();
</script>
</body>
</html>
